name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          test -s notes.md || { echo "No CHANGELOG entry for ${GITHUB_REF_NAME}"; exit 1; }

      # The module files only, for a local copy in the configurations that use it
      - name: Module archive
        run: |
          archive="terraform-cloudflare-easy-dns-${GITHUB_REF_NAME}.tar.gz"
          mkdir -p dist/module
          git archive HEAD -- ':(glob)*.tf' modules schema README.md CHANGELOG.md LICENSE \
            ':(exclude,glob)modules/**/tests/**' | tar -x -C dist/module
          echo "$GITHUB_REF_NAME" >dist/module/VERSION
          tar -czf "dist/${archive}" -C dist/module .
          (cd dist && sha256sum "${archive}" >SHA256SUMS)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest \
            "dist/terraform-cloudflare-easy-dns-${GITHUB_REF_NAME}.tar.gz" dist/SHA256SUMS

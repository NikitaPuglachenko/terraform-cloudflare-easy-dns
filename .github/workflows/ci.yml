name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - name: Check that the root module and the wrappers have the same interface
        run: ./scripts/check-sync.sh

  test:
    name: Validate and test (${{ matrix.dir }}, terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - modules/dns/records
          - modules/dns/v4
          - modules/dns/v5
          - examples/v4
          - examples/v5
        # Minimum supported and the latest version
        terraform: [1.8.5, latest]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v7
      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          sudo tar -xzf terraform-docs.tar.gz -C /usr/local/bin terraform-docs
          rm terraform-docs.tar.gz
      - run: ./scripts/generate-docs.sh
      - name: Check that module READMEs are up to date
        run: git diff --exit-code || { echo "Module READMEs are outdated, run ./scripts/generate-docs.sh"; exit 1; }

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
